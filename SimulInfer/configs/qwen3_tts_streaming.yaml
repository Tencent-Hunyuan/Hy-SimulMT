# Use in the TTS environment with:
# simulinfer-tts-omni --model /path/to/Qwen3-TTS-12Hz-0.6B-Base --deploy-config configs/qwen3_tts_streaming.yaml
# Both stages use device 0 within CUDA_VISIBLE_DEVICES. Adjust memory allocation for your GPU.
model_runner: v2
async_chunk: true
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      talker_first_audio: true
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 8
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1
      decode_batch_max_size: 1
stages:
- stage_id: 0
  max_num_seqs: 1
  gpu_memory_utilization: 0.35
  trust_remote_code: true
  enable_prefix_caching: false
  async_scheduling: true
  max_num_batched_tokens: 512
  max_model_len: 2048
  devices: '0'
  output_connectors:
    to_stage_1: connector_of_shared_memory
  default_sampling_params:
    temperature: 0.9
    top_k: 50
    max_tokens: 1024
    min_tokens: 2
    repetition_penalty: 1.05
  silence_ban_frames: 0
  subtalker_sampling_params:
    do_sample: true
    temperature: 0.9
    top_k: 50
    top_p: 1.0
  enforce_eager: true
- stage_id: 1
  dtype: bfloat16
  max_num_seqs: 1
  gpu_memory_utilization: 0.35
  enforce_eager: true
  trust_remote_code: true
  enable_prefix_caching: false
  async_scheduling: true
  max_num_batched_tokens: 65536
  max_model_len: 65536
  devices: '0'
  input_connectors:
    from_stage_0: connector_of_shared_memory
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 65536
    repetition_penalty: 1.0
platforms:
  rocm:
    model_runner: v1
    stages:
    - stage_id: 1
      enforce_eager: true
  npu:
    model_runner: v1
    stages:
    - stage_id: 0
      enforce_eager: false
      compilation_config:
        cudagraph_mode: PIECEWISE
    - stage_id: 1
      compilation_config:
        cudagraph_mode: PIECEWISE
  xpu:
    model_runner: v1
  musa:
    model_runner: v1
